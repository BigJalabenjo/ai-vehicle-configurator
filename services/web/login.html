<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · BMW Configurator Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img id="logo" class="logo" alt="BMW" hidden>
        <span class="wordmark">BMW</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="product">Configurator Assistant</span>
      </div>
    </div>
  </header>

  <main class="login">
    <form id="login-form" class="login-card" autocomplete="on" novalidate>
      <p class="eyebrow">Prototype · access restricted</p>
      <h1>Sign in</h1>
      <p class="muted">Enter the access password to continue.</p>
      <label class="field">
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button id="login-submit" class="btn primary full" type="submit">Sign in</button>
    </form>
  </main>

  <script src="login.js" type="module"></script>
</body>
</html>

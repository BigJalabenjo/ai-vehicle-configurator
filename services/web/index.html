<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMW Configurator Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img id="logo" class="logo" alt="BMW" hidden>
        <span class="wordmark">BMW</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="product">Configurator Assistant</span>
      </div>
      <div class="topbar-actions">
        <span id="mode" class="mode" title="Which agent answers">…</span>
        <button id="new-session" class="text-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New conversation
        </button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="chat" aria-label="Conversation">
      <div id="scroll" class="scroll">
        <div class="hero">
          <p class="eyebrow">AI Assistant · Prototype with a fictional catalog</p>
          <h1>Find and configure your BMW.</h1>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>
      </div>
      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-inner">
          <textarea id="input" rows="1" maxlength="2000"
            placeholder="Describe what you need, or ask to change something…" aria-label="Message"></textarea>
          <button id="send" type="submit" class="btn primary">Send</button>
        </div>
      </form>
    </section>

    <aside class="panel" aria-label="Your configuration">
      <section class="panel-section">
        <h2>Your needs</h2>
        <div id="needs" class="chips"><p class="muted">Nothing yet. Describe your situation in the chat.</p></div>
        <details id="assumptions-box" class="assumptions" hidden>
          <summary>How I interpreted this</summary>
          <ul id="assumptions"></ul>
        </details>
      </section>
      <section class="panel-section" id="config-card">
        <h2>Your configuration</h2>
        <div id="config"><p class="muted">Choose a model to start configuring.</p></div>
      </section>
    </aside>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>

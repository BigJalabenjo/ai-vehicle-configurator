<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMW Configurator Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img id="logo" class="logo" alt="BMW" hidden>
        <span class="wordmark">BMW</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="product">Configurator Assistant</span>
      </div>
      <div class="topbar-actions">
        <button id="new-session" class="text-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New conversation
        </button>
      </div>
    </div>
  </header>

  <main class="layout">
    <!-- Configure mode: the selected vehicle takes centre stage -->
    <section id="stage" class="stage" aria-label="Your BMW" aria-hidden="true"></section>

    <section class="chat" aria-label="Conversation">
      <div class="chat-head">
        <span>Assistant</span>
        <button id="chat-min" class="icon-btn" type="button" title="Minimize the assistant" aria-label="Minimize the assistant">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
      </div>
      <div id="scroll" class="scroll">
        <div class="hero">
          <p class="eyebrow">AI Assistant · Prototype with a fictional catalog</p>
          <h1>Find and configure your BMW.</h1>
        </div>
        <div id="messages" class="messages" aria-live="polite"></div>
      </div>
      <!-- What the assistant understood (discover mode; the configurator shows it on the stage) -->
      <div id="needs-bar" class="needs-bar" hidden>
        <span class="label">Your needs</span>
        <div id="needs" class="chips"></div>
        <details id="assumptions-box" class="assumptions" hidden>
          <summary>How I interpreted this</summary>
          <ul id="assumptions"></ul>
        </details>
      </div>
      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-inner">
          <textarea id="input" rows="1" maxlength="2000"
            placeholder="Ask anything…" aria-label="Message"></textarea>
          <button id="send" type="submit" class="btn primary">Send</button>
        </div>
      </form>
    </section>

  </main>

  <button id="chat-fab" class="fab" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
    Assistant
  </button>

  <script src="app.js" type="module"></script>
</body>
</html>

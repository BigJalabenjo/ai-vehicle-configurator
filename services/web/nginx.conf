server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers for the static client
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional brand assets: explicit types so fonts and logos are served correctly; no SPA fallback.
    location /assets/ {
        types {
            application/json json;
            image/svg+xml svg;
            image/png png;
            image/webp webp;
            image/jpeg jpg jpeg;
            font/woff2 woff2;
            font/woff woff;
            font/otf otf;
            font/ttf ttf;
        }
        try_files $uri =404;
    }

    # Same-origin API: the browser never talks to the agent or catalog services directly.
    location /api/ {
        proxy_pass http://agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }
}

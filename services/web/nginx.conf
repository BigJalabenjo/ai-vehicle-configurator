# Rate limit for sign-in attempts (per client IP): slows down password guessing.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# Keep the original scheme when a TLS-terminating proxy sits in front (for Secure cookies).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers for the static client
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Framing: only this site itself, plus the origins in EMBED_ORIGINS (e.g. https://configure.bmw.de for the
    # Chrome extension overlay). Replaces X-Frame-Options, which cannot express an allowlist.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'self' ${EMBED_ORIGINS}" always;
    # Revalidate app files on every load (cheap 304s) so updates reach browsers immediately.
    add_header Cache-Control "no-cache" always;

    # ---------------------------------------------------------------- password protection
    # Pages are only served to signed-in visitors; the agent decides (GET /api/auth/check).
    # With APP_PASSWORD unset the check always passes.
    location = /_auth {
        internal;
        proxy_pass http://agent:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location @login {
        return 302 /login.html;
    }

    # Public: the sign-in page and what it needs (styles, logo, fonts).
    location = /login.html { try_files $uri =404; }
    location = /login.js   { try_files $uri =404; }
    location = /styles.css { try_files $uri =404; }

    # Everything else requires a valid session.
    location / {
        auth_request /_auth;
        error_page 401 = @login;
        try_files $uri $uri/ /index.html;
    }

    # Brand assets: logo, fonts and the manifest are public (used on the sign-in page) ...
    location /assets/ {
        types {
            application/json json;
            image/svg+xml svg;
            image/png png;
            image/webp webp;
            image/jpeg jpg jpeg;
            font/woff2 woff2;
            font/woff woff;
            font/otf otf;
            font/ttf ttf;
        }
        try_files $uri =404;
    }
    # ... vehicle photos only after sign-in.
    location /assets/cars/ {
        auth_request /_auth;
        types { image/webp webp; image/png png; image/jpeg jpg jpeg; image/avif avif; }
        try_files $uri =404;
    }

    # ---------------------------------------------------------------- API
    # Same-origin API: the browser never talks to the agent or catalog services directly.
    # The agent enforces sign-in for /api itself (except /api/auth/* and /api/health).
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 4k;
    }
    # Voice recordings are bigger than chat messages (up to ~30 s of 16 kHz WAV).
    location ~ ^/api/sessions/[^/]+/voice/transcribe$ {
        proxy_pass http://agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
    location /api/ {
        proxy_pass http://agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }
}

<text x="46" y="852" font-size="14" font-weight="700" fill="#232F3E">CI/CD</text>
<text x="46" y="871" font-size="12" fill="#3B4450">GitHub Actions → ECR →</text>
<text x="46" y="887" font-size="12" fill="#3B4450">ECS blue/green deploys</text>
<text x="1430" y="150" font-size="14" font-weight="700" fill="#232F3E">Flow &amp; key decisions</text>
<text x="1430" y="172" font-size="12.5" fill="#3B4450" xml:space="preserve">① SPA served via CloudFront from S3</text>
<text x="1430" y="190" font-size="12.5" fill="#3B4450" xml:space="preserve">② Same-origin API; WAF + throttling</text>
<text x="1430" y="208" font-size="12.5" fill="#3B4450" xml:space="preserve">③ Each turn is free text or a structured</text>
<text x="1430" y="226" font-size="12.5" fill="#3B4450" xml:space="preserve">   UI action (card click, toggle, slider)</text>
<text x="1430" y="244" font-size="12.5" fill="#3B4450" xml:space="preserve">④ Claude interprets needs, plans tool calls</text>
<text x="1430" y="262" font-size="12.5" fill="#3B4450" xml:space="preserve">   and chooses adaptive UI components</text>
<text x="1430" y="280" font-size="12.5" fill="#3B4450" xml:space="preserve">⑤ Prices, rules and compatibility only come</text>
<text x="1430" y="298" font-size="12.5" fill="#3B4450" xml:space="preserve">   from the deterministic engine; the agent</text>
<text x="1430" y="316" font-size="12.5" fill="#3B4450" xml:space="preserve">   never invents them (grounded UI)</text>
<text x="1430" y="334" font-size="12.5" fill="#3B4450" xml:space="preserve">⑥ Stateless containers scale out; state</text>
<text x="1430" y="352" font-size="12.5" fill="#3B4450" xml:space="preserve">   lives in DynamoDB with TTL</text>
<text x="1430" y="370" font-size="12.5" fill="#3B4450" xml:space="preserve">⑦ Catalog versions pass integrity checks</text>
<text x="1430" y="388" font-size="12.5" fill="#3B4450" xml:space="preserve">   before they are published</text>
<text x="1430" y="406" font-size="12.5" fill="#3B4450" xml:space="preserve">⑧ Hand-over only with consent</text>
<text x="1430" y="424" font-size="12.5" fill="#3B4450" xml:space="preserve"></text>
<text x="1430" y="442" font-size="12.5" fill="#3B4450" xml:space="preserve">Resilience: LLM timeout/outage → guided</text>
<text x="1430" y="460" font-size="12.5" fill="#3B4450" xml:space="preserve">rule-based mode; retries with backoff;</text>
<text x="1430" y="478" font-size="12.5" fill="#3B4450" xml:space="preserve">multi-AZ; health checks; autoscaling</text>
<text x="1430" y="496" font-size="12.5" fill="#3B4450" xml:space="preserve">Privacy: no PII in prompts or logs,</text>
<text x="1430" y="514" font-size="12.5" fill="#3B4450" xml:space="preserve">Guardrails PII filter, EU region</text>
<text x="1430" y="532" font-size="12.5" fill="#3B4450" xml:space="preserve"></text>
<text x="1430" y="550" font-size="12.5" fill="#3B4450" xml:space="preserve">Prototype mapping: nginx → CloudFront/S3;</text>
<text x="1430" y="568" font-size="12.5" fill="#3B4450" xml:space="preserve">agent &amp; catalog containers → ECS;</text>
<text x="1430" y="586" font-size="12.5" fill="#3B4450" xml:space="preserve">in-memory sessions → DynamoDB;</text>
<text x="1430" y="604" font-size="12.5" fill="#3B4450" xml:space="preserve">Anthropic API → Bedrock</text>
</svg>
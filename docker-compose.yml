name: vehicle-configurator
# One command to run the whole prototype:  docker compose up --build
# Open http://localhost:8080
# AI mode: put OPENAI_API_KEY (or ANTHROPIC_API_KEY) in a local .env file (never committed).
# Without a key, guided (offline) mode is used.
services:
  catalog:
    build: ./services/catalog
    environment:
      LOG_LEVEL: INFO
    expose: ["8001"]
    restart: unless-stopped

  agent:
    build: ./services/agent
    depends_on:
      catalog:
        condition: service_healthy
    environment:
      CATALOG_URL: http://catalog:8001
      AGENT_MODE: ${AGENT_MODE:-auto}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EFFORT: ${LLM_EFFORT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_SECRET: ${APP_SECRET:-}
      AUTH_TTL_HOURS: ${AUTH_TTL_HOURS:-12}
      CORS_ORIGINS: http://localhost:8080
    expose: ["8000"]
    restart: unless-stopped

  web:
    build: ./services/web
    depends_on:
      agent:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Catalog service tests
        working-directory: services/catalog
        run: python -m pytest -q
      - name: Agent service tests (guided + scripted Claude mode, no API key needed)
        working-directory: services/agent
        run: python -m pytest -q

  containers:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the stack
        run: |
          docker compose up --build -d --wait
          curl -fsS http://localhost:8080/api/health
          curl -fsS -X POST http://localhost:8080/api/sessions | grep -q session_id
          docker compose down
